  <header>
    <div><h1>存储分析报告</h1><div class="meta" id="meta"></div></div>
    <a class="jump-link" href="#action-items">查看处理建议</a>
  </header>
  <div id="app"></div>
  <footer>storage-analyzer · 只读扫描 · 文件操作需明确确认 · 移回收站后仍占用空间</footer>
</div>
<dialog id="action-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-impact">
  <div class="confirm-body">
    <h2 id="confirm-title"></h2>
    <p id="confirm-impact" class="confirm-impact"></p>
    <p id="confirm-count" class="confirm-count"></p>
    <ol id="confirm-paths" class="confirm-paths"></ol>
  </div>
  <form method="dialog" class="confirm-footer">
    <button class="del-btn" value="cancel" autofocus>取消</button>
    <button id="confirm-submit" class="del-btn primary" value="confirm">确认操作</button>
  </form>
</dialog>

<script>
const DATA = __REPORT_DATA__;
const DELETE = __DELETE_CONFIG__; // null=静态只读报告；{token,endpoint}=server.py 提供一键删除
const FM = (DATA.system && /win/i.test(DATA.system.os||'')) ? '资源管理器' : '访达'; // 文件管理器名，按系统
const TW = (DATA.system && /win/i.test(DATA.system.os||'')) ? '回收站' : '废纸篓'; // 回收容器名，按系统

// —— 服务健康监测：server.py 死掉/被替换时，页面给出明确指引而不是玄学 Failed to fetch ——
function markServerDown(){
  let b = document.getElementById('srv-banner');
  if(!b){
    b = document.createElement('div');
    b.id = 'srv-banner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c73e47;color:#fff;padding:10px 16px;font:14px/1.6 system-ui,sans-serif;';
    b.innerHTML = '<b>报告服务已断开</b>：本标签页对应的服务已关闭或已被替换，所有按钮都会失败。请关闭本标签页，重新运行 server.py（同一份分析会自动复用存活实例）打开新页面。';
    document.body.appendChild(b);
  }
  b.style.display = 'block';
  const pill = document.getElementById('srv-pill');
  if(pill){ pill.innerHTML = '● 服务已断开'; pill.style.color = '#c73e47'; pill.style.borderColor = '#f6c9cd'; }
}
function markServerUp(){
  const b = document.getElementById('srv-banner'); if(b) b.style.display = 'none';
  const pill = document.getElementById('srv-pill');
  if(pill){ pill.innerHTML = '● 服务运行中'; pill.style.color = ''; pill.style.borderColor = ''; }
}
if(DELETE && DELETE.endpoint){
  const pill = document.createElement('div');
  pill.id = 'srv-pill';
  pill.className = 'service-indicator';
  pill.innerHTML = '● 服务运行中';
  const mount=document.getElementById('service-status');
  if(mount){ mount.textContent=''; mount.appendChild(pill); }
  const hb = () => fetch(DELETE.endpoint.replace(/\/action$/,'/heartbeat'), {cache:'no-store'})
    .then(r=>r.ok ? markServerUp() : markServerDown())
    .catch(()=>markServerDown());
  hb(); setInterval(hb, 8000);
}

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// "约" 已表示估算，去掉冗余的"（估算…）"括号让大小显示更干净专业
const cleanSize = s => String(s==null?'':s).replace(/[（(]\s*估算[^）)]*[）)]/g, '').trim();

function copyBtn(text){
  const id='c'+Math.random().toString(36).slice(2);
  // store raw text on element via data attribute (base64 to survive quotes)
  return `<button class="copy" data-cmd="${btoa(unescape(encodeURIComponent(text)))}">复制</button>`;
}


function renderSystem(s, sm){
  document.getElementById('meta').textContent =
    `生成于 ${DATA.generated_at}　·　扫描耗时 ${DATA.scan_seconds==null?'未知':DATA.scan_seconds+'s'}`;
  // 已用部分分段：绿(可自动清)+橙(需手动)+红(已识别的不建议动项)+蓝(其他/系统等未归类的已用)，余下灰底为可用
  const total = parseGB(s.disk_total) || 1;
  const used = parseGB(s.disk_used);
  const ts = sm && sm.tier_stats;
  const g = ts ? parseGB(ts.green) : 0;
  const y = ts ? parseGB(ts.yellow) : 0;
  const r = ts ? parseGB(ts.red) : 0;
  const other = Math.max(0, used - g - y - r); // 既非红黄绿、也未单独列出的已用空间（系统+零碎文件）
  let bar;
  if(g > 0 || y > 0 || r > 0){
    const seg=(v,cls,label)=> v>0?`<i class="${cls}" style="width:${(v/total*100).toFixed(2)}%" title="${label}：约 ${v.toFixed(1)} GB"></i>`:'';
    bar = seg(g,'seg-green','可自动清')+seg(y,'seg-yellow','需手动')+seg(r,'seg-red','谨慎清理')+seg(other,'seg-blue','系统及其他');
  } else {
    bar = `<i class="used" style="width:${(used/total*100).toFixed(2)}%"></i>`;
  }
  const fmtGB = v => v>0?`约 ${v.toFixed(1)} GB`:'-';
  const otherPill = other>0?`<span class="pill"><span class="dot blue"></span>系统及其他 <b>${fmtGB(other)}</b></span>`:'';
  let pills='';
  if(sm && sm.tier_stats){
    pills=`<div class="pills">
      <span class="pill"><span class="dot green"></span>可自动清 <b>${fmtGB(g)}</b></span>
      <span class="pill"><span class="dot yellow"></span>需手动 <b>${fmtGB(y)}</b></span>
      <span class="pill"><span class="dot red"></span>谨慎清理 <b>${fmtGB(r)}</b></span>
      ${otherPill}
    </div>`;
  }
  // 多盘符（Windows）：主盘用上面的分段条，其余盘紧凑列出
  const allDisks = s.disks || [];
  const others = allDisks.filter(d => d.name !== s.disk_name);
  const barLabel = allDisks.length > 1
    ? `<div class="bar-label">系统盘 ${esc(s.disk_name||'')}${(sm && sm.tier_stats)?' · 已用部分按清理分级着色':''}</div>` : '';
  const otherDisksBlock = others.length ? `<div class="other-disks">
      <div class="label">其他磁盘</div>
      ${others.map(d=>{
        const u=parseGB(d.used), t=parseGB(d.total)||1;
        const pct=Math.min(100, u/t*100).toFixed(1);
        return `<div class="odisk"><span class="odisk-name">${esc(d.name)}</span>
          <div class="obar"><i style="width:${pct}%"></i></div>
          <span class="odisk-num">${esc(d.used)} / ${esc(d.total)}</span></div>`;
      }).join('')}</div>` : '';
  return `<div class="overview">
    ${parseGB(s.disk_total)>0?`<div class="stats">
      <div class="stat"><div class="k">总容量</div><div class="v">${esc(s.disk_total)}</div></div>
      <div class="stat"><div class="k">已用</div><div class="v">${esc(s.disk_used)}</div></div>
      <div class="stat"><div class="k">可用</div><div class="v">${esc(s.disk_free)}</div></div>
      ${s.purgeable?`<div class="stat"><div class="k">可清除(系统)</div><div class="v">${esc(s.purgeable)}</div></div>`:''}
    </div>
    ${barLabel}
    <div class="bar">${bar}</div>
    <div class="ruler"><span>0</span><span>${esc(s.disk_total)}</span></div>
    ${pills}`:'<p class="capacity-unknown">未提供磁盘容量数据。本报告仅展示已扫描范围。</p>'}
    ${otherDisksBlock}
    <details class="system-details"><summary>系统与扫描位置</summary><div class="sysgrid">
      <div><span>系统　</span>${esc(s.os)} (${esc(s.build)})</div>
      <div><span>架构　</span>${esc(s.arch)}</div>
      <div><span>文件系统　</span>${esc(s.filesystem)}</div>
      <div><span>用户　</span>${esc(s.user)}</div>
      <div class="home-path"><span>主目录</span>${esc(s.home)}</div>
    </div></details>
  </div>`;
}
// 从 "约 27.8 GB（…）" / "300.3 GB" 这类字符串里取数值，统一换算成 GB
function parseGB(str){
  if(!str) return 0;
  const m=String(str).match(/([\d.]+)\s*(TB|GB|MB)?/i);
  if(!m) return 0;
  let v=parseFloat(m[1]); const u=(m[2]||'GB').toUpperCase();
  if(u==='TB') v*=1024; else if(u==='MB') v/=1024;
  return v;
}

// —— 系统占用：只读探测结果，单独成段，不并入三灯、不提供删除按钮 ——
function renderSystemSpace(ss){
  if(!ss || !ss.items || !ss.items.length) return '';
  const ea = ss.elevated_analysis || null;
  const dism = (ea && ea.dism && ea.dism.parsed) ? ea.dism.parsed : null;
  const elevCmd = 'py -3 scripts/probe_system.py --elevate --json "%TEMP%/sys_probe_admin.json"';
  let elevated = '';
  if(ss.elevated && dism && dism.available){
    const rec = dism.recommended===true ? '建议清理' : (dism.recommended===false ? '暂不建议清理' : '未知');
    elevated = `<div class="elev"><b>管理员只读分析（DISM AnalyzeComponentStore）</b>
      <div class="mini-grid">
        <div><span>组件存储实际大小</span>${esc(dism.actual||'未知')}</div>
        <div><span>与 Windows 共享</span>${esc(dism.shared||'未知')}</div>
        <div><span>备份和禁用的功能</span>${esc(dism.backups||'未知')}</div>
        <div><span>缓存和临时数据</span>${esc(dism.cache||'未知')}</div>
        <div><span>可回收程序包</span>${dism.reclaimable==null?'未知':esc(dism.reclaimable)+' 个'}</div>
        <div><span>DISM 建议</span>${esc(rec)}</div>
      </div>
      <div class="note">这是 DISM 的只读分析结果，不代表已经执行清理；实际可释放量以执行时为准。</div>
    </div>`;
  } else if(ss.elevated){
    elevated = `<div class="elev warn"><b>管理员分析未完成</b>${ea && ea.error ? `（${esc(ea.error)}）` : ''}，可回收量仍未知。</div>`;
  } else {
    elevated = `<div class="elev">当前是普通权限探测：这里只有目录尺寸，<b>不是可回收量</b>。
      <div class="cmd-label">可选：仅需进一步诊断 WinSxS 时运行以下命令。普通分析可跳过；结果提供实际大小与清理建议，不承诺释放空间：</div>
      <div class="cmd">${esc(elevCmd)}${copyBtn(elevCmd)}</div>
      <div class="note">结果写出后，用 <code>py -3 scripts/probe_system.py --merge &lt;analysis.json&gt; --with "%TEMP%/sys_probe_admin.json"</code> 合并进分析 JSON，再重新打开报告。</div>
    </div>`;
  }
  const note = `<div class="sys-note">系统级空间：只读探测，<b>本页不提供删除按钮</b>。清理需要管理员权限，且多数操作不可逆；请按条目说明自行在管理员终端执行命令，执行前确认风险。</div>`;
  const cards = ss.items.map(it=>{
    const meta = [];
    meta.push('风险：' + (it.risk_label || it.risk || '未知'));
    meta.push(it.admin_required ? '需要管理员权限' : '免管理员可读');
    if(it.files) meta.push(it.files + ' 个文件');
    if(it.denied) meta.push(it.denied + ' 个路径无权读取');
    let body = `<div class="field"><div class="label">处置说明</div>${esc(it.note||'')}</div>`;
    if(it.reclaim && it.reclaim.actual){
      body += `<div class="field"><div class="label">DISM 分析</div>实际 ${esc(it.reclaim.actual)} · 与 Windows 共享 ${esc(it.reclaim.shared||'未知')} · 可回收程序包 ${esc(it.reclaim.reclaimable_packages==null?'未知':it.reclaim.reclaimable_packages)}</div>`;
    }
    if(it.command){
      body += `<div class="cmd-label">官方处置命令（复制后自行执行，本页不代执行）</div>
        <div class="cmd">${esc(it.command)}${copyBtn(it.command)}</div>`;
    }
    body += `<div class="note">${meta.map(esc).join(' · ')}</div>`;
    return card('blue', it.name, it.present ? it.size_h : '未检测到', it.path, esc(it.brief||''), body, '');
  }).join('');
  return section('系统占用（只读探测，需管理员处置）', ss.items.length, note + elevated + cards);
}

function renderTop5(rows){
  if(!rows) return '';
  const tiers={green:'缓存建议',yellow:'需你判断',red:'谨慎处理'};
  const body=rows.map(r=>`<tr>
    <td class="rank-number">${esc(r.rank)}</td>
    <td class="rank-identity">
      <div class="rank-title"><b>${esc(r.name)}</b>${tiers[r.tier]?`<span class="tier-label ${esc(r.tier)}">${esc(tiers[r.tier])}</span>`:''}</div>
      <p class="rank-note">${esc(r.type)}${r.note?' · '+esc(r.note):''}</p>
      <details class="rank-detail"><summary>路径与依据</summary><div class="row-path">${esc(r.path)}</div></details>
    </td>
    <td class="size">${esc(cleanSize(r.size))}</td>
  </tr>`).join('');
  return `<section class="sec ranking"><div class="section-head"><h2>主要占用</h2><span class="count">${rows.length} 项</span></div>
    ${rows.length?`<div class="table-scroll"><table><thead><tr><th scope="col">排名</th><th scope="col">项目与依据</th><th scope="col" class="size">扫描大小</th></tr></thead><tbody>${body}</tbody></table></div>`:'<div class="empty-state">本次分析未提供占用排行，请先核对扫描范围。</div>'}
  </section>`;
}

function renderGreen(items){
  if(!items||!items.length) return '';
  const rows=items.map(it=>{
    const procs=(it.kill_processes&&it.kill_processes.length)
      ? `<span class="tag">需先关闭 ${esc(it.kill_processes.join('、'))}</span>`:'';
    const hasTrash=DELETE&&it.trash_paths&&it.trash_paths.length;
    return `<div class="item green">
      <div class="item-head"><span class="dot green"></span><div class="row-info">
        <div class="row-top"><span class="item-name">${esc(it.name)}${procs}</span>${it.size_estimate?`<span class="item-size">${esc(cleanSize(it.size_estimate))}</span>`:''}</div>
        <div class="row-path">${esc(it.path)}</div>
      </div></div>
      <div class="row-sub decision-grid">${renderEvidence(it)}<div class="field"><div class="label">下一步</div>${esc(it.next_step||'核对具体内容并关闭相关应用；用途不确定时先在应用的存储或缓存管理中查看。')}</div></div>
      ${(it.commands||[]).length?`<div class="item-commands">${it.commands.map(c=>`<div class="cmd-label">${esc(c.label)}</div><div class="cmd">${esc(c.cmd)}${copyBtn(c.cmd)}</div>`).join('')}</div>`:''}
      ${hasTrash?`<div class="del-actions item-action-bar" data-paths="${b64(it.trash_paths)}"><div class="del-row">
        <button class="del-btn trash" onclick="doDelete(this,'trash')">移到${TW}</button>
        <button class="del-btn danger" onclick="doDelete(this,'rm')">直接删除</button><span class="del-status" role="status" aria-live="polite"></span>
      </div></div>`:''}
    </div>`;
  }).join('');
  return section('可处理的缓存',items.length,'<p class="sec-note">仅处理已核实的具体路径。目录体量不是保证可释放量；移入'+TW+'后仍占用空间。</p>'+rows,greenBatchActions(items));
}

// 绿灯批量操作仍需核对分析依据和全部精确路径。
// 橙灯/红灯需逐项判断，不给批量。仅 server.py 模式且至少一项有 trash_paths 时渲染。
function greenBatchActions(items){
  if(!DELETE) return '';
  if(!items.some(it => it.trash_paths && it.trash_paths.length)) return '';
  return `<span class="sec-actions">
    <button class="del-btn trash" onclick="doBatch(this,'trash')">全部移${TW}</button>
    <button class="del-btn danger" onclick="doBatch(this,'rm')">全部删除</button>
    <span class="del-status sec-status"></span>
  </span>`;
}

// Preserve the per-path result so partially completed cards can safely resume.
function actionResult(wrap, res, mode){
  const status = wrap.querySelector('.del-status');
  const paths = JSON.parse(decodeURIComponent(escape(atob(wrap.dataset.paths || b64([])))));
  const results = res.results || (res.done||[]).map(path=>({path,status:'completed'}));
  const done = new Set(results.filter(r=>['completed','already_missing'].includes(r.status)).map(r=>r.path));
  const remaining = paths.filter(p=>!done.has(p));
  const count = paths.length - remaining.length;
  const missing = results.filter(r=>paths.includes(r.path) && r.status==='already_missing').length;
  const ownResults = results.filter(r=>paths.includes(r.path));
  const notAttempted = ownResults.length && ownResults.every(r=>r.status==='not_attempted');
  const failure = ownResults.find(r=>['failed','cancelled'].includes(r.status));
  const complete = remaining.length===0;
  if(complete && paths.length){
    wrap.closest('.item')?.classList.add('cleaned');
    wrap.querySelectorAll('.del-btn.trash,.del-btn.danger').forEach(b=>b.remove());
  }
  wrap.dataset.paths = b64(remaining);
  const verb = mode==='rm' ? '已删除（未测量磁盘净释放量）' : '已移到'+TW+'（清空后才可能释放空间）';
  status.textContent = complete ? `${verb}${missing?'；其中 '+missing+' 个路径原已不存在':''}`
    : `${count?'部分完成：'+count+'/'+paths.length+' 个路径。':''}${res.status==='cancelled'?'已取消：':''}${res.error||'未完成'}。请检查失败目标，目录内部可能已部分处理。`;
  if(missing===paths.length && paths.length) status.textContent='目标原已不存在，本次未删除文件，也未测量释放空间。';
  if(notAttempted) status.textContent='尚未执行：本批已在此前的路径处停止。';
  if(failure) status.textContent += ' 目标：'+failure.path;
  status.className='del-status '+(complete?'ok':'err');
}

async function doBatch(btn, mode){
  const secActions = btn.closest('.sec-actions');
  const sec = btn.closest('.sec');
  const status = secActions.querySelector('.del-status');
  const wraps = [...sec.querySelectorAll('.item.green .del-actions')]
    .filter(w => !w.closest('.item').classList.contains('cleaned'));
  const allPaths=wraps.flatMap(w=>JSON.parse(decodeURIComponent(escape(atob(w.dataset.paths)))));
  if(!allPaths.length){ status.textContent='没有待处理路径'; return; }
  if(!await requestConfirmation(allPaths, mode)){ status.textContent='已取消，未发送操作。'; status.className='del-status sec-status'; return; }
  postAction(secActions, allPaths, mode).then(res=>{
    wraps.forEach(w=>actionResult(w, res, mode));
    status.textContent = res.ok ? '本批路径已处理；报告体量仍是扫描时快照。' : '本批未全部完成，请查看各项结果。'+(res.error||'');
    status.className='del-status sec-status '+(res.ok?'ok':'err');
    if(res.ok) secActions.querySelectorAll('.del-btn').forEach(b=>b.remove());
  });
}

function actionConfirmation(paths, mode){
  return {
    title: mode==='rm' ? '确认直接删除？' : '确认移到'+TW+'？',
    impact: (mode==='rm' ? '直接删除不可恢复。' : '移到'+TW+'后仍占用空间；清空后才可能释放。')+
      '目录操作包含其全部子目录和文件。报告大小是扫描时快照，不保证等于释放量。',
    paths: paths.slice()
  };
}

function requestConfirmation(paths, mode){
  const dialog=document.getElementById('action-confirm');
  // Fail closed in browsers without <dialog>; never send an unconfirmed action.
  if(!dialog || typeof dialog.showModal!=='function') return Promise.resolve(false);
  if(dialog.open) return Promise.resolve(false);
  const info=actionConfirmation(paths,mode);
  document.getElementById('confirm-title').textContent=info.title;
  document.getElementById('confirm-impact').textContent=info.impact;
  document.getElementById('confirm-count').textContent='核对以下 '+paths.length+' 个目标路径';
  document.getElementById('confirm-paths').innerHTML=paths.map(p=>'<li>'+esc(p)+'</li>').join('');
  const submit=document.getElementById('confirm-submit');
  submit.textContent=mode==='rm'?'确认直接删除':'确认移到'+TW;
  submit.className='del-btn primary'+(mode==='rm'?' danger':'');
  dialog.returnValue='cancel';
  return new Promise(resolve=>{
    dialog.addEventListener('close',()=>resolve(dialog.returnValue==='confirm'),{once:true});
    dialog.showModal();
  });
}

function postAction(wrap, paths, mode){
  const status = wrap.querySelector('.del-status');
  const btns = document.querySelectorAll('.del-btn');
  status.textContent = '处理中…'; status.className='del-status';
  btns.forEach(b=>b.disabled=true);
  return fetch(DELETE.endpoint, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:DELETE.token, paths, mode})})
    .then(r=>r.json()).then(res=>{ btns.forEach(b=>b.disabled=false); return res; })
    .catch(e=>{ btns.forEach(b=>b.disabled=false); markServerDown(); return {ok:false, error:'连接失败，操作结果未知（'+e+'）。请先检查原路径，不要直接重试；报告服务可能已关闭。'}; });
}

async function doDelete(btn, mode){
  const wrap = btn.closest('.del-actions');
  const paths = JSON.parse(decodeURIComponent(escape(atob(wrap.dataset.paths))));
  if(!await requestConfirmation(paths, mode)){ const status=wrap.querySelector('.del-status'); status.textContent='已取消，未发送操作。'; status.className='del-status'; return; }
  postAction(wrap, paths, mode).then(res=>actionResult(wrap, res, mode));
}

function doOpen(btn){
  const wrap = btn.closest('.del-actions');
  const paths = JSON.parse(decodeURIComponent(escape(atob(wrap.dataset.open))));
  postAction(wrap, paths, 'open').then(res=>{
    const status = wrap.querySelector('.del-status');
    if(res.ok){ status.textContent='已提交到'+FM+'的打开请求；请检查窗口，本操作未清理文件'; status.className='del-status ok'; }
    else { status.textContent='未全部打开：'+(res.error||'失败')+'；已提交 '+(res.done||[]).length+' 个路径'; status.className='del-status err'; }
  });
}

const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));

function renderYellow(items){
  if(!items||!items.length) return '';
  const note = `<div class="sec-note">「在${FM}里打开」只查看、不删任何东西；「移到${TW}」仅针对核实过的安全子路径，可逆。是否该删的完整判断依据：点开条目查看。</div>`;
  const cards = items.map(it=>card('yellow', it.name, it.size, it.path,
    esc(it.content_profile),
    `${renderEvidence(it)}<div class="field"><div class="label">为什么需要人工判断</div>${esc(it.why_manual)}</div>
     <div class="field"><div class="label">处置路径</div>${esc(it.disposal)}</div>
     <div class="risk">风险：${esc(it.risk)}</div>`,
    yellowActions(it))).join('');
  return section('需要你判断', items.length, note + cards);
}
// 橙灯操作：打开文件夹（去自己审查删）+ 仅当有核实过的安全子路径时给「移到废纸篓」（只可逆，不直接删）
function yellowActions(it){
  if(!DELETE) return '';
  const hasTrash = DELETE && it.trash_paths && it.trash_paths.length;
  const trashBtn = hasTrash
    ? `<button class="del-btn trash" onclick="doDelete(this,'trash')">移到${TW}（所列路径）</button>` : '';
  return `<div class="field del-actions" data-paths="${hasTrash?b64(it.trash_paths):''}" data-open="${b64([it.path])}">
    <div class="del-row">
      ${it.path?`<button class="del-btn open" onclick="doOpen(this)">在${FM}里打开</button>`:''}
      ${trashBtn}
      <span class="del-status"></span>
    </div>
  </div>`;
}
function renderRed(items){
  if(!items||!items.length) return '';
  const note = `<div class="sec-note">应用本体在系统目录，请在打开的文件夹里用自带卸载器或系统「设置>应用」卸载；本页不代删。</div>`;
  const cards = items.map(it=>card('red', it.name, it.size||'', it.path,
    esc(it.why_keep),
    `${renderEvidence(it)}<div class="field"><div class="label">卸载 / 释放建议</div>${esc(it.indirect_release)}</div>
     ${it.auto_reclaim?`<div class="field"><div class="label">可释放</div>${esc(it.auto_reclaim)}</div>`:''}`,
    redActions(it))).join('');
  return section('建议正规卸载', items.length, note + cards);
}
// 红灯操作：只给「在文件管理器里打开并选中该 App」，让用户自己正规卸载（不后台代删，App 需谨慎）
function redActions(it){
  if(!DELETE || !it.app_paths || !it.app_paths.length) return '';
  return `<div class="field del-actions" data-open="${b64(it.app_paths)}">
    <div class="del-row">
      <button class="del-btn open" onclick="doOpen(this)">在${FM}里打开（去卸载）</button>
      <span class="del-status"></span>
    </div>
  </div>`;
}
function card(tier,name,size,path,brief,inner,actions){
  return `<div class="item ${tier}">
    <div class="item-head" onclick="this.parentNode.classList.toggle('open')">
      <span class="dot ${tier}"></span>
      <span class="item-name">${esc(name)}</span>
      <span class="item-badge"></span>
      ${size?`<span class="item-size">${esc(cleanSize(size))}</span>`:''}
      <span class="chev" aria-hidden="true">›</span>
    </div>
    <div class="row-sub">
      <div class="row-path">${esc(path)}</div>
      ${brief?`<div class="row-brief">${brief}</div>`:''}
      ${actions||''}
    </div>
    ${inner?`<div class="item-body">${inner}</div>`:''}
  </div>`;
}function section(title,count,inner,actions){
  return `<section class="sec"><div class="section-head"><h2>${esc(title)}</h2><span class="count">${count} 项</span>${actions||''}</div>${inner}</section>`;
}

const sumList=a=>(a&&a.length)?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';

// 执行建议：放在 Top5 之后、三级明细之前（先看处方，再看每项怎么做）
// 开头用 overview 一句洞察作引子，下面是优先级清单
function renderPriority(sm){
  if(!sm||(!sm.priority&&!sm.overview)) return '';
  const intro=sm.overview?`<p class="lead">${esc(sm.overview)}</p>`:'';
  const body=sm.priority?(Array.isArray(sm.priority)?sumList(sm.priority):`<p>${esc(sm.priority)}</p>`):'';
  return `<section class="sec priority"><div class="section-head"><h2>处理顺序</h2></div><div class="summary">${intro}${body}<a class="inline-link" href="#action-items">查看每项依据与操作</a></div></section>`;
}

// 长期优化建议：留在报告最后
function renderLongTerm(sm){
  if(!sm || !sm.long_term || !sm.long_term.length) return '';
  return `<div class="sec"><h2>长期优化建议</h2><div class="summary">${sumList(sm.long_term)}</div></div>`;
}

function renderEvidence(it){
  return `<div class="field"><div class="label">判断依据</div>${esc(it.evidence || '未提供核实依据；体积或名称不能证明内容可安全删除，请先核对用途。')}</div>`;
}

function renderCoverage(){
  const c=DATA.coverage;
  if(!c) return `<div class="denied"><b>扫描范围与完整性未提供</b>：这份分析未附带 coverage，不能据此确认已完整扫描。旧版 macOS 扫描由 du 报告分配空间，Windows 为逻辑文件长度；两者均不等于可释放空间。</div>`;
  const scope={all_local_fixed_volumes:'本地固定盘',windows_hotspots:'Windows 热点目录',synthetic_fixture:'隔离合成目录（演示）'}[DATA.scan_scope] || DATA.scan_scope || '未注明';
  const failed=c.denied_count||0, skipped=c.skipped_reparse_count||0;
  const targets=Object.entries(c.groups||{});
  const filtered=targets.reduce((n,[k,v])=>n+(v.below_threshold||0)+(v.omitted_by_limit||0),0);
  return `<div class="coverage ${failed?'warn':''}">
    <div class="coverage-heading"><b>${failed?'扫描有遗漏':'扫描覆盖说明'}</b><span>${esc(scope)}</span></div>
    <div class="coverage-metrics"><span><strong>${failed}</strong> 次读取失败</span><span><strong>${skipped}</strong> 个链接已跳过</span><span><strong>${filtered}</strong> 个子项未展开</span></div>
    <p>${failed?'已知体量只是下限，请先查看遗漏依据。':'在所列范围内未记录读取失败；不代表覆盖整台电脑。'}</p>
    <details><summary>查看扫描目标与遗漏依据</summary><div class="coverage-body">
      <p>大小口径：${esc(c.size_basis||'未注明')}。按名称出现的硬链接未去重，压缩、稀疏文件与物理占用可能不同。不同热点分组可能父子重叠，不能相加。列表有阈值和条数限制。</p>
      ${targets.map(([k,v])=>`<div class="row-path">${esc(v.path)}<br>阈值 ${esc(v.min_kb)} KB · 最多 ${esc(v.limit)} 项 · 低于阈值 ${esc(v.below_threshold)} 项 / 超出上限 ${esc(v.omitted_by_limit)} 项</div>`).join('')}
      ${(c.volumes||[]).map(v=>`<div class="row-path">${esc(v.root)}<br>已读 ${esc(v.files)} 文件 / ${esc(v.directories)} 目录</div>`).join('')}
      ${(c.denied||[]).map(v=>`<div class="row-path">${esc(v.path)}<br>${esc({permission_denied:'权限不足',not_found:'路径不存在或扫描期间消失',io_error:'读取失败'}[v.reason]||v.reason||'读取失败')} · ${esc(v.error)}</div>`).join('')}
      ${c.denied_sample_truncated?'<p>失败路径仅列出前 500 条，以上不是完整清单。</p>':''}
      ${(c.skipped_reparse||[]).map(p=>`<div class="row-path">跳过链接：${esc(p)}</div>`).join('')}
      ${skipped>(c.skipped_reparse||[]).length?'<p>跳过链接的路径仅列出样本，以总数为准。</p>':''}
      <p>磁盘容量和建议体量是扫描时快照；执行操作后不会自动重新扫描。</p>
    </div></details></div>`;
}

function renderDenied(){
  if(!DATA.denied||!DATA.denied.length) return '';
  return `<div class="denied"><b>以下目录权限不足未能读取，可能遗漏体量：</b><br>${DATA.denied.map(esc).join('<br>')}</div>`;
}

// mount
const app=document.getElementById('app');
app.innerHTML = '<div class="scan-context '+(parseGB(DATA.system.disk_total)>0?'':'without-capacity')+'">'
  + renderSystem(DATA.system, DATA.summary) + '</div>'
  + '<div class="diagnosis-grid">' + renderTop5(DATA.top5)
  + '<div class="decision-aside">' + renderCoverage() + renderPriority(DATA.summary) + '</div></div>'
  + '<div id="action-items">' + renderGreen(DATA.green) + renderYellow(DATA.yellow) + renderRed(DATA.red) + '</div>'
  + renderSystemSpace(DATA.system_space) + renderDenied() + renderLongTerm(DATA.summary);

// copy handlers (delegated)
document.addEventListener('click', e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  e.stopPropagation();
  const text=decodeURIComponent(escape(atob(b.dataset.cmd)));
  navigator.clipboard.writeText(text).then(()=>{
    b.textContent='已复制'; b.classList.add('done');
    setTimeout(()=>{b.textContent='复制';b.classList.remove('done');},1500);
  });
});
</script>
</body>
</html>
